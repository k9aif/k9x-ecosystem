# repo_url adds a GitHub link to a card. Without url_prod the card is
# download-and-run only (no probe, no up/down dot, "run locally").
#
# K9X Arena: arena.k9x.ai is the PUBLIC, read-only showcase (published
# matches + setup guide; ARENA_MODE=public, :8112). The lab that runs
# matches is intranet-only (:8111) and deliberately not listed here.
# /api/health verified 2026-09-29 to return real JSON
# ({"ok":true,"mode":"showcase"}) and unknown paths 404 -- no SPA catch-all.
- name: K9X Arena
  slug: arena
  description: LLMs head to head on your own GPU — graded against right answers, starred, and teaching a model router
  url_prod: https://arena.k9x.ai
  url_local: null
  repo_url: https://github.com/k9aif/k9x-arena
  health_path: /api/health
  category: evaluation

# K9X Sentinel: daily threat watch for K9-AIF. sentinel.k9x.ai runs the real
# instance (:8114) with an admin login and a read-only demo login (demo/demo)
# that sees open gaps only as "under private review". /api/health is public
# and returns {"status":"ok"}; everything else needs a login.
- name: K9X Sentinel
  slug: sentinel
  description: Reads new AI-security research every morning, checks it against K9-AIF's defences, and sends the gaps to human review
  url_prod: https://sentinel.k9x.ai
  url_local: null
  repo_url: https://github.com/k9aif/k9x-sentinel
  health_path: /api/health
  category: security

# K9X Inspector: continuous conformance for K9-AIF solutions (k9-aif >= 1.15
# k9_inspect rules). inspector.k9x.ai runs the real instance (:8115) with an
