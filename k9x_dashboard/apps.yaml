# k9x_dashboard — application catalog
# Hand-maintained, not auto-discovered (see dashboard_plan.md's reasoning:
# ~10 apps, changes rarely, a live health probe already catches staleness).
#
# Only the 5 products Ravi confirmed as "live ecosystem" (2026-09-21) are
# listed here for v1. Other real apps (k9chat, EOC, DAS, k9x_testcases)
# exist but don't have confirmed production subdomains/local ports yet --
# add them once verified rather than guessing.
#
# Known issue, not fixed here (out of scope for this dashboard): HIL's
# main.py hardcodes port 8086 regardless of its own .env's REPO_PORT, and
# Enterprise Repository's run.sh genuinely uses REPO_PORT=8086 too -- both
# apps are configured for the same local port. Doesn't matter in
# production (separate Cloudflare-tunneled subdomains), but the two can't
# both run locally at once as configured today.
#
# health_path is /health for Continuum/Repo/HIL (confirmed real JSON:
# {"status":"ok",...}) but /api/health for Studio and SATAN -- their
# plain /health is masked by their own SPA's catch-all route, which
# returns 200 with the app's index.html for ANY unmatched path (confirmed
# live 2026-09-22: studio.k9x.ai/health served a full HTML page, not
# JSON, despite the response claiming content-type: application/json --
# was silently showing "up" even if a genuinely-down backend were being
# masked by a still-cached static frontend). Verify with the response
# BODY, not just the status code, before trusting any new entry's
# health_path -- a catch-all route makes almost any path return 200.

